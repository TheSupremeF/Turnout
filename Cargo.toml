[workspace]
resolver = "2"
members = [
    "crates/relay-core",
    "crates/relay-config",
    "crates/relay-credentials",
    "crates/relay-gateway",
    "crates/relay-cli",
    "crates/relay-tui",
    "crates/provider-openai",
    "crates/provider-anthropic",
    "crates/provider-evren",
    "crates/harness-codex",
    "crates/harness-claude",
    "crates/harness-opencode",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheSupremeF/Turnout"

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-config = { path = "crates/relay-config" }
relay-credentials = { path = "crates/relay-credentials" }
relay-gateway = { path = "crates/relay-gateway" }
relay-tui = { path = "crates/relay-tui" }
provider-openai = { path = "crates/provider-openai" }
provider-anthropic = { path = "crates/provider-anthropic" }
provider-evren = { path = "crates/provider-evren" }
harness-codex = { path = "crates/harness-codex" }
harness-claude = { path = "crates/harness-claude" }
harness-opencode = { path = "crates/harness-opencode" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "process",
    "fs",
    "signal",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
axum = "0.8"
url = "2"
bytes = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
jsonwebtoken = "9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
